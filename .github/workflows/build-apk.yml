name: Construire l'APK LoCoREB

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer les dossiers
        run: |
          mkdir -p www resources
          cp LoCoREB_Apk.html www/index.html
          cp icon.png resources/icon.png

      - name: Installer les outils Capacitor
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Générer les icônes
        run: npx --yes @capacitor/assets@3 generate --android --assetPath resources

      - name: Ignorer l'agrandissement du texte du système Android
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          pkg=$(grep -m1 '^package' "$f")
          cat > "$f" <<JAVA
          $pkg

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  registerPlugin(WaSharePlugin.class);
                  super.onCreate(savedInstanceState);
              }

              private void fixerTexte() {
                  try {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().getSettings().setTextZoom(100);
                      }
                  } catch (Exception e) {
                  }
              }

              @Override
              public void onStart() {
                  super.onStart();
                  fixerTexte();
              }

              @Override
              public void onResume() {
                  super.onResume();
                  fixerTexte();
              }
          }
          JAVA

      - name: Ajouter l'envoi direct vers WhatsApp
        run: |
          f=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          d=$(dirname "$f")
          pkg=$(grep -m1 '^package' "$f")
          {
          echo "$pkg"
          cat <<'JAVA'

          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.net.Uri;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;

          @CapacitorPlugin(name = "WaShare")
          public class WaSharePlugin extends Plugin {
              @PluginMethod
              public void envoyer(PluginCall call) {
                  try {
                      String path = call.getString("path");
                      String type = call.getString("type", "application/octet-stream");
                      String texte = call.getString("texte", "");
                      if (path == null) {
                          call.reject("fichier manquant");
                          return;
                      }
                      File fichier = new File(Uri.parse(path).getPath());
                      Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName() + ".fileprovider", fichier);
                      String[] paquets = {"com.whatsapp", "com.whatsapp.w4b"};
                      for (String paquet : paquets) {
                          Intent it = new Intent(Intent.ACTION_SEND);
                          it.setType(type);
                          it.putExtra(Intent.EXTRA_STREAM, uri);
                          if (texte != null && !texte.isEmpty()) {
                              it.putExtra(Intent.EXTRA_TEXT, texte);
                          }
                          it.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          it.setPackage(paquet);
                          try {
                              getActivity().startActivity(it);
                              JSObject r = new JSObject();
                              r.put("ok", true);
                              call.resolve(r);
                              return;
                          } catch (ActivityNotFoundException e) {
                              // on essaie l'application suivante
                          }
                      }
                      call.reject("WhatsApp absent");
                  } catch (Exception e) {
                      call.reject("Erreur : " + e.getMessage());
                  }
              }
          }
          JAVA
          } > "$d/WaSharePlugin.java"

      - name: Ajouter les autorisations d'enregistrement de fichiers
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Utiliser la clé de signature fixe
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Copier l'application et synchroniser
        run: npx cap sync android

      - name: Construire l'APK
        run: |
          cd android
          chmod +x gradlew
          if ! ./gradlew assembleDebug --stacktrace; then
            echo "::warning title=Plugin WhatsApp::La compilation a échoué avec le plugin WhatsApp natif : nouvelle tentative sans lui (le bouton WhatsApp utilisera alors la liste de partage Android)."
            f=$(find app/src/main/java -name MainActivity.java | head -n 1)
            d=$(dirname "$f")
            sed -i '/registerPlugin(WaSharePlugin.class);/d' "$f"
            rm -f "$d/WaSharePlugin.java"
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LoCoREB.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: LoCoREB-APK
          path: LoCoREB.apk
